services:
  messages-bridge:
    image: ghcr.io/xingguangcuican6666/messages-bridge:latest
    # 想本地构建就把下面一行换成 build: .
    container_name: messages-bridge
    restart: unless-stopped
    ports:
      - "${BRIDGE_PORT:-8080}:8080"
    # 让容器能用 host.docker.internal 指到宿主机（走宿主机代理时要用）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LISTEN_ADDR: ":8080"
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:?UPSTREAM_BASE_URL is required}
      # 留空：密钥由 new-api 渠道透传进来；填了也只作为无密钥调用方的兜底
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
      MODEL_MAP: ${MODEL_MAP:-}
      PASS_REASONING_EFFORT: ${PASS_REASONING_EFFORT:-true}
      # /v1/messages 上游协议：chat_completions（默认）或 responses。
      # .env 只会用于这里的插值，不写进 environment 容器里就没有这个变量。
      UPSTREAM_API: ${UPSTREAM_API:-chat_completions}
      # 仅原生 POST /v1/responses 的可选无状态兼容模式，默认关闭
      RESPONSES_STATELESS: ${RESPONSES_STATELESS:-false}
      RESPONSES_STATELESS_DROP_HEADERS: ${RESPONSES_STATELESS_DROP_HEADERS:-}
      UPSTREAM_TIMEOUT: ${UPSTREAM_TIMEOUT:-10m}
      # 走宿主机代理时填 http://host.docker.internal:7890；留空则用容器里的
      # HTTP_PROXY / HTTPS_PROXY / NO_PROXY，都没有就直连
      UPSTREAM_PROXY: ${UPSTREAM_PROXY:-}
      LOG_BODIES: ${LOG_BODIES:-false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # 日志轮转：桥接服务的请求日志默认很小，这里再兜一层上限
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
